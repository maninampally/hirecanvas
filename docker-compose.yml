# 1. Define shared environment variables
x-environment: &env_vars
  NODE_ENV: production
  # Updated to match the new service name 'valkey'
  REDIS_URL: redis://valkey:6379
  
  # Optional variables (silenced warnings)
  GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
  GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
  GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
  GEMINI_API_KEY_5: ${GEMINI_API_KEY_5:-}
  OPENAI_API_KEY_2: ${OPENAI_API_KEY_2:-}
  OPENAI_API_KEY_3: ${OPENAI_API_KEY_3:-}
  OPENAI_API_KEY_4: ${OPENAI_API_KEY_4:-}
  OPENAI_API_KEY_5: ${OPENAI_API_KEY_5:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
  STRIPE_ELITE_PRICE_ID: ${STRIPE_ELITE_PRICE_ID:-}
  STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
  STRIPE_ELITE_YEARLY_PRICE_ID: ${STRIPE_ELITE_YEARLY_PRICE_ID:-}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
  PYTHON_NLP_SERVICE_URL: ${PYTHON_NLP_SERVICE_URL:-}
  MONTHLY_INFRA_ESTIMATE_CENTS: ${MONTHLY_INFRA_ESTIMATE_CENTS:-}
  AWS_SES_REGION: ${AWS_SES_REGION:-}
  AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:-}
  AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:-}
  SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
  SES_DRY_RUN: ${SES_DRY_RUN:-}

# 2. Define shared worker configuration
x-worker-base: &worker_base
  build:
    context: .
    dockerfile: Dockerfile
    target: worker-runner
    args:
      CACHEBUST: ${CACHEBUST:-}
  image: hirecanvas-worker:latest
  environment: *env_vars
  depends_on:
    valkey:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        CACHEBUST: ${CACHEBUST:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    image: hirecanvas-app:latest
    ports:
      - "3000:3000"
    environment: *env_vars
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-sync:
    <<: *worker_base
    command: ["npm", "run", "worker:sync"]

  worker-extract:
    <<: *worker_base
    command: ["npm", "run", "worker:extract"]

  worker-nudge:
    <<: *worker_base
    command: ["npm", "run", "worker:nudge"]

  worker-digest:
    <<: *worker_base
    command: ["npm", "run", "worker:digest"]

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aura-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Overriding the default entrypoint lets us use shell scripting
    entrypoint: ["/usr/bin/sh", "-c"]
    command: >
      "ollama serve & 
       sleep 5 && 
       ollama pull llama3.2 &&
       ollama pull nomic-embed-text &&
       wait"

volumes:
  valkey_data:
  ollama_data: