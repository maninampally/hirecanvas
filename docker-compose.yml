# 1. Define shared environment variables
x-environment: &env_vars
  NODE_ENV: production
  # Updated to match the new service name 'valkey'
  REDIS_URL: redis://valkey:6379
  
  # Supabase (required for sync/extraction workers)
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  
  # App
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  
  # Security
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  SYNC_CRON_SECRET: ${SYNC_CRON_SECRET:-}
  ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
  SYNC_WORKER_CONCURRENCY: ${SYNC_WORKER_CONCURRENCY:-2}
  
  # Gmail OAuth
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
  
  # Stripe (placeholder — configure before enabling payments)
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
  STRIPE_ELITE_PRICE_ID: ${STRIPE_ELITE_PRICE_ID:-}
  STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
  STRIPE_ELITE_YEARLY_PRICE_ID: ${STRIPE_ELITE_YEARLY_PRICE_ID:-}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

  # AWS SES (email delivery)
  AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
  AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:-}
  AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:-}
  SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
  SES_DRY_RUN: ${SES_DRY_RUN:-true}

  # Python NLP service
  PYTHON_NLP_SERVICE_URL: ${PYTHON_NLP_SERVICE_URL:-}

  # Infra cost tracking
  MONTHLY_INFRA_ESTIMATE_CENTS: ${MONTHLY_INFRA_ESTIMATE_CENTS:-}

  # AI Keys
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
  GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
  GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
  GEMINI_API_KEY_5: ${GEMINI_API_KEY_5:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_API_KEY_2: ${OPENAI_API_KEY_2:-}
  OPENAI_API_KEY_3: ${OPENAI_API_KEY_3:-}
  OPENAI_API_KEY_4: ${OPENAI_API_KEY_4:-}
  OPENAI_API_KEY_5: ${OPENAI_API_KEY_5:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  # AI model overrides (optional — defaults used if unset)
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_VERIFIER_MODEL: ${OPENAI_VERIFIER_MODEL:-}
  CLAUDE_MODEL: ${CLAUDE_MODEL:-}
  EXTRACTION_MODE: ${EXTRACTION_MODE:-}

  # Gmail sync tuning (optional)
  GMAIL_SYNC_QUERY: ${GMAIL_SYNC_QUERY:-}
  GMAIL_SYNC_PAGE_SIZE: ${GMAIL_SYNC_PAGE_SIZE:-}
  GMAIL_SYNC_MAX_MESSAGES: ${GMAIL_SYNC_MAX_MESSAGES:-}

  # Ollama (optional local LLM)
  OLLAMA_API_URL: ${OLLAMA_API_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

  # Observability
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

# 2. Define shared worker configuration
x-worker-base: &worker_base
  build:
    context: .
    dockerfile: Dockerfile
    target: worker-runner
    args:
      CACHEBUST: ${CACHEBUST:-}
  image: hirecanvas-worker:latest
  environment: *env_vars
  depends_on:
    valkey:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        CACHEBUST: ${CACHEBUST:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    image: hirecanvas-app:latest
    ports:
      - "3000:3000"
    environment: *env_vars
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-sync:
    <<: *worker_base
    command: ["npm", "run", "worker:sync"]

  worker-extract:
    <<: *worker_base
    command: ["npm", "run", "worker:extract"]

  worker-nudge:
    <<: *worker_base
    command: ["npm", "run", "worker:nudge"]

  worker-digest:
    <<: *worker_base
    command: ["npm", "run", "worker:digest"]

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ollama:  # disabled — enable when OLLAMA_ONLY=true needed
  #   image: ollama/ollama:latest
  #   container_name: aura-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   entrypoint: ["/usr/bin/sh", "-c"]
  #   command: >
  #     "ollama serve &
  #      sleep 5 &&
  #      ollama pull qwen2.5:7b &&
  #      wait"

